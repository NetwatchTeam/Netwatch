<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Plan du site du dashboard NetWatch" font-family="Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="1100" height="560" fill="#fff"/><text x="40" y="40" font-size="20" fill="#1e293b" font-weight="700" text-anchor="start">Plan du site — dashboard NetWatch</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Gabarit commun (Layout) : menu latéral à gauche, contenu à droite. Chaque page a une entrée dans le menu, sauf la fiche équipement et la page introuvable.</text><rect x="420" y="90" width="260" height="56" rx="8" fill="#334155" stroke="#334155"/><text x="550" y="114" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Layout — menu latéral</text><text x="550" y="133" font-size="10.5" fill="#cbd5e1" font-weight="400" text-anchor="middle">components/Layout.tsx</text><rect x="40" y="180" width="300" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/><text x="56" y="202" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">ESPACE DIRECTION — gestionnaire</text><rect x="60" y="216" width="260" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="190" y="238" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Vue d’ensemble</text><text x="190" y="256" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/</text><rect x="60" y="300" width="260" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="190" y="322" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Rapport hebdomadaire</text><text x="190" y="340" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/rapport · export PDF</text><rect x="380" y="180" width="680" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/><text x="396" y="202" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">ESPACE TECHNIQUE — technicien</text><rect x="400" y="216" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="500" y="238" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Équipements</text><text x="500" y="256" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/equipements</text><rect x="620" y="216" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="720" y="238" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Événements</text><text x="720" y="256" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/evenements</text><rect x="840" y="216" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="940" y="238" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">À valider</text><text x="940" y="256" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/a-identifier</text><rect x="400" y="300" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="500" y="322" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Fiche équipement</text><text x="500" y="340" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/equipements/:id</text><rect x="620" y="300" width="200" height="52" rx="8" fill="#eaf1fe" stroke="#1f5fd6"/><text x="720" y="322" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Dépendances</text><text x="720" y="340" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/dependances</text><rect x="840" y="300" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="940" y="322" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Scans</text><text x="940" y="340" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/scans</text><rect x="840" y="384" width="200" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="940" y="406" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Réglages</text><text x="940" y="424" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">/technique/reglages</text><rect x="40" y="410" width="300" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="190" y="432" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Page introuvable</text><text x="190" y="450" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">toute autre adresse</text><line x1="470" y1="146" x2="190" y2="178" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/><line x1="630" y1="146" x2="720" y2="178" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/><line x1="500" y1="268" x2="500" y2="298" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="600" y1="326" x2="618" y2="326" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="320" y1="242" x2="398" y2="242" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="190" y1="268" x2="190" y2="298" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="40" y="498" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Flèches pleines : le menu donne accès aux deux espaces. Pointillés : liens à l’intérieur des pages.</text><text x="40" y="516" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Liens dans les pages : les cartes de la vue d’ensemble ouvrent Équipements (filtré par état), Événements et À valider ;</text><text x="40" y="534" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">une ligne d’équipement, d’événement ou de dépendance ouvre la fiche de la machine ; la fiche d’un PC renvoie vers sa passerelle.</text><rect x="0.5" y="0.5" width="1099" height="559" fill="none" stroke="#cbd5e1"/></svg>
